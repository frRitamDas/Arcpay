name: Release Arcpay

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release v1.1]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create temporary release signing key
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -storepass arcpay-release \
            -keypass arcpay-release \
            -alias arcpay \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Ritam Das, OU=Arcpay, O=Arcpay, L=Kolkata, ST=West Bengal, C=IN"
          printf '%s\n' \
            'storeFile=$GITHUB_WORKSPACE/release.jks' \
            'storePassword=arcpay-release' \
            'keyAlias=arcpay' \
            'keyPassword=arcpay-release' > keystore.properties

      - name: Run tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build and verify Arcpay 1.1 release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Publish GitHub Release v1.1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          if gh release view v1.1 >/dev/null 2>&1; then
            gh release upload v1.1 "$APK" --clobber
          else
            gh release create v1.1 "$APK" --title "Arcpay 1.1" --latest --notes "Arcpay 1.1 — Developer: Ritam Das

          App renamed to Arcpay and version updated to 1.1.
          
          The APK is built, signed, and verified by the release workflow."
          fi
